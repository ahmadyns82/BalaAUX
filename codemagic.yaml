workflows:

  ios-build-ipa:
    name: BalaAUX – Build Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Reconstruct project
        script: |
          mkdir -p Models ViewModels Services Views
          mkdir -p BalaAUX.xcodeproj/project.xcworkspace/xcshareddata
          mkdir -p BalaAUX.xcodeproj/xcshareddata/xcschemes

          echo "" | base64 --decode > BalaAUX.xcodeproj/project.pbxproj
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPFdvcmtzcGFjZSB2ZXJzaW9uID0gIjEuMCI+PEZpbGVSZWYgbG9jYXRpb24gPSAic2VsZjoiPjwvRmlsZVJlZj48L1dvcmtzcGFjZT4=" | base64 --decode > BalaAUX.xcodeproj/project.xcworkspace/contents.xcworkspacedata
          echo "" | base64 --decode > BalaAUX.xcodeproj/xcshareddata/xcschemes/BalaAUX.xcscheme

          echo "" | base64 --decode > Models/Song.swift
          echo "" | base64 --decode > ViewModels/PlayerViewModel.swift
          echo "" | base64 --decode > Services/AudioSessionManager.swift
          echo "" | base64 --decode > Services/MusicLibrary.swift
          echo "" | base64 --decode > Services/HFPManager.swift
          echo "" | base64 --decode > Services/CallKitManager.swift
          echo "" | base64 --decode > Views/FolderBrowserView.swift
          echo "" | base64 --decode > Views/SongsListView.swift
          echo "" | base64 --decode > Views/PlayerView.swift
          echo "" | base64 --decode > Views/MiniPlayerView.swift
          echo "" | base64 --decode > Views/SettingsView.swift

          echo "=== All files ready ==="
          find . -name "*.swift" | sort

      - name: Build unsigned
        script: |
          xcodebuild \
            -project BalaAUX.xcodeproj \
            -scheme BalaAUX \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath $CM_BUILD_DIR/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        script: |
          APP=$(find $CM_BUILD_DIR/derived -name "BalaAUX.app" -path "*Release-iphoneos*" | head -1)
          [ -z "$APP" ] && APP=$(find $CM_BUILD_DIR/derived -name "*.app" -path "*iphoneos*" | head -1)
          echo "App: $APP"
          mkdir -p $CM_BUILD_DIR/Payload
          cp -r "$APP" $CM_BUILD_DIR/Payload/BalaAUX.app
          cd $CM_BUILD_DIR
          zip -r BalaAUX.ipa Payload/
          ls -lh BalaAUX.ipa

    artifacts:
      - $CM_BUILD_DIR/BalaAUX.ipa

    publishing:
      email:
        recipients:
          - ahmad.yns@hotmail.com
        notify:
          success: true
          failure: true
